services:
  evidence-desk:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      REPORT_UPLOAD_TOKEN: "${REPORT_UPLOAD_TOKEN:?set REPORT_UPLOAD_TOKEN}"
      REPORT_MAX_BYTES: "10485760"
    volumes:
      - paper-review-data:/data/reports

volumes:
  paper-review-data:
